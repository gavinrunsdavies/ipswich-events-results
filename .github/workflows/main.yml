# Basic workflow to push all code changes from master to the JAFFA live site

name: 🚀 Deploy to live website on push

on:
  push:
    branches: [ 'main' ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:

  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    environment: Live JAFFA
    steps: 
      
    - name: 🚚 Get latest code
      uses: actions/checkout@v2   

    # Deploy files to test site via FTP
    - name: 📂 Sync files to test
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: ftp.ipswichjaffa.org.uk
        username: githubftp@ipswichjaffa.org.uk
        password: ${{ secrets.FtpServerPassword }}
        server-dir: public_html/wordpress/wp-content/plugins/ipswich-jaffa-event-results/
        dry-run: false
        exclude: |
          **/.git*
          **/.git*/**        
          api/config.php

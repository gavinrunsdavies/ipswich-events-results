# 🚀 Deploy to JAFFA test website when pushing to any feature branch

name: 🚀 Deploy to test website on push

on:
  push:
    branches: [ 'feature/**' ]

  # Allows manual trigger
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    environment: Test JAFFA
    env:
      EVENTS_RESULTS_DB_NAME: ${{ secrets.EVENTS_RESULTS_DB_NAME }}
      EVENTS_RESULTS_DB_USER: ${{ secrets.EVENTS_RESULTS_DB_USER }}
      EVENTS_RESULTS_DB_PASSWORD: ${{ secrets.EVENTS_RESULTS_DB_PASSWORD }}

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v2

      - name: 📝 Write runtime database config
        shell: bash
        run: |
          cat <<'PHP' > api/config.php
          <?php
          if (!defined('EVENTS_RESULTS_DB_NAME')) {
              define('EVENTS_RESULTS_DB_NAME', getenv('EVENTS_RESULTS_DB_NAME') ?: '***');
          }

          if (!defined('EVENTS_RESULTS_DB_USER')) {
              define('EVENTS_RESULTS_DB_USER', getenv('EVENTS_RESULTS_DB_USER') ?: '***');
          }

          if (!defined('EVENTS_RESULTS_DB_PASSWORD')) {
              define('EVENTS_RESULTS_DB_PASSWORD', getenv('EVENTS_RESULTS_DB_PASSWORD') ?: '***');
          }
          PHP

      # Deploy files to test site via FTP
      - name: 📂 Sync files to test
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ftp.ipswichjaffa.org.uk
          username: github-ipswich-jaffa-events-results@test.ipswichjaffa.org.uk
          password: ${{ secrets.FtpServerPassword }}
          server-dir: public_html/wp-content/plugins/ipswich-jaffa-events-results/
          dry-run: false
          exclude: |
            **/.git*
            **/.git*/**
